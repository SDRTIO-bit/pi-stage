<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pi rp-engine</title>
<link rel="stylesheet" href="style.css" />
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
<script defer src="app.js"></script>
</head>
<body>

<div
  class="app"
  x-data="chat"
  x-init="ensureSession()"
  @keydown.escape="sidebarCollapsed = true"
>
  <!-- ==== Card Selection (no session) ==== -->
  <div class="card-select" x-show="!sessionId">
    <div class="card-select-header">
      <h1><strong>pi</strong> rp-engine</h1>
      <p class="fade">选择角色卡开始对话</p>
    </div>
    <div class="card-list" x-show="cards.length > 0">
      <template x-for="card in cards" :key="card.id">
        <div class="card-item" @click="selectCard(card.id)">
          <div class="card-item-name" x-text="card.name"></div>
          <div class="card-item-meta">
            <span class="tag" x-text="card.id"></span>
            <template x-for="tag in (card.tags || [])" :key="tag">
              <span class="tag" x-text="tag"></span>
            </template>
            <span class="tag dim" x-show="card.hasSkills">skills ready</span>
          </div>
        </div>
      </template>
    </div>
    <div class="card-list-empty" x-show="cards.length === 0 && !loadingCards">
      <p>暂无角色卡</p>
      <p class="fade">通过 Card Importer 导入 .png / .json 角色卡</p>
    </div>
    <div x-show="loadingCards" class="loading-bar"></div>
  </div>

  <!-- ==== Sidebar ==== -->
  <aside class="sidebar" id="sidebar" :class="{ collapsed: sidebarCollapsed }" x-show="sessionId">
    <div class="sidebar-header"><strong>pi</strong> rp-engine</div>
    <div class="sidebar-content">
      <div class="stat-group">
        <div class="stat-label">Card</div>
        <div class="stat-row"><span>Name</span><span class="val" x-text="cardName">—</span></div>
        <div class="stat-row"><span>ID</span><span class="val" x-text="selectedCardId">—</span></div>
      </div>
      <div class="stat-group">
        <div class="stat-label">Session</div>
        <div class="stat-row"><span>ID</span><span class="val" x-text="shortId">—</span></div>
        <div class="stat-row"><span>History</span><span class="val" x-text="historyCount">0</span></div>
        <div class="stat-row"><span>Phase</span><span class="val" x-text="phase">idle</span></div>
      </div>
      <div class="stat-group">
        <div class="stat-label">Pipeline</div>
        <div class="stat-row"><span>Nodes</span><span class="val" x-text="nodeCount">0</span></div>
        <div class="stat-row"><span>Degraded</span><span class="val" x-text="degraded">no</span></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <span class="dot" :class="statusDot"></span><span x-text="statusText">engine ready</span>
    </div>
  </aside>

  <!-- ==== Main ==== -->
  <div class="main" x-show="sessionId">
    <div class="chat-header">
      <span><span class="accent" x-text="cardName">—</span> · <span class="fade" x-text="shortId">—</span></span>
      <div class="header-actions">
        <button class="btn" @click="newSession">+ New</button>
        <button class="btn" @click="clearMessages">Clear</button>
        <button class="btn" @click="sidebarCollapsed = !sidebarCollapsed">☰</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages" x-ref="messages">
      <template x-for="(msg, i) in messages" :key="i">
        <div
          x-show="msg.show !== false"
          x-transition.opacity.scale.origin-top
          :class="`msg ${msg.type}`"
          x-text="msg.text"
        ></div>
      </template>

      <div x-show="loading" class="loading-bar"></div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <input
        type="text"
        x-model="input"
        @keydown.enter="send"
        placeholder="输入消息或 /command…"
        autofocus
      />
      <button id="btnSend" @click="send" :disabled="loading">Send</button>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <span>tokens: <span class="v" x-text="tokens">0</span></span>
      <span>turns: <span class="v" x-text="historyCount">0</span></span>
      <span class="fade" x-text="'ready'"></span>
    </div>
  </div>
</div>

</body>
</html>
