<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PI RP — Web</title>
  <style>
    :root {
      --bg: #0d0d0d; --surface: #1a1a1a; --border: #2a2a2a;
      --fg: #c0c0c0; --fg-dim: #606060; --accent: #4af;
      --green: #4caf50; --yellow: #ffc107; --red: #f44336;
      --font: "Cascadia Code", "JetBrains Mono", "Fira Code", monospace;
      --sidebar-w: 300px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--fg); font: 13px var(--font); }
    .app { display: flex; height: 100vh; }
    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--fg-dim); letter-spacing: 1px; }
    .sidebar-header strong { color: var(--accent); font-weight: 600; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; color: var(--fg-dim); font-size: 11px; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: none; }
    .tab-content.active { display: block; }
    .card-item, .session-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .card-item:hover, .session-item:hover { background: rgba(255,255,255,0.03); }
    .card-item .name, .session-item .name { color: var(--fg); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-item .active-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
    .card-item .active-dot.on { background: var(--green); }
    .card-item .active-dot.off { background: var(--border); }
    .sidebar-footer { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--fg-dim); }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .chat-header .ws-status { width: 8px; height: 8px; border-radius: 50%; }
    .chat-header .ws-status.on { background: var(--green); }
    .chat-header .ws-status.off { background: var(--red); }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
    .msg { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.system { color: var(--fg-dim); font-style: italic; font-size: 12px; }
    .msg.user { color: var(--fg); }
    .msg.user::before { content: "❯ "; color: var(--green); }
    .msg.assistant { color: var(--accent); }
    .msg.assistant::before { content: "◆ "; }
    .msg.event { color: var(--yellow); font-size: 11px; }
    .msg.error { color: var(--red); }
    .input-area { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .input-area input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--fg); padding: 10px 14px; border-radius: 4px; font: 13px var(--font); outline: none; }
    .input-area input:focus { border-color: var(--accent); }
    .input-area button { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font: 600 13px var(--font); }
    .input-area button:hover { opacity: 0.85; }
    .input-area button.danger { background: var(--red); color: #fff; }
    .status-bar { padding: 6px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--fg-dim); display: flex; gap: 20px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
    .modal.show { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); padding: 20px; max-width: 500px; width: 90%; border-radius: 8px; }
    .modal-box h3 { margin-bottom: 12px; color: var(--accent); }
    .modal-box .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .modal-box label { display: block; margin-bottom: 4px; color: var(--fg-dim); font-size: 11px; }
    .modal-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg); padding: 8px; border-radius: 4px; font: 12px var(--font); }
    .modal-box button { margin-top: 12px; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><strong>PI</strong> RP Engine</div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('cards')">Cards</div>
      <div class="tab" onclick="switchTab('sessions')">Sessions</div>
    </div>
    <div class="tab-content active" id="tab-cards">
      <div id="cardList"><div style="color:var(--fg-dim);padding:8px">点击 Refresh 加载</div></div>
      <div style="padding:8px"><button style="width:100%" onclick="wsSend({type:'list_cards'})">↻ Refresh</button></div>
    </div>
    <div class="tab-content" id="tab-sessions">
      <div id="sessionList"><div style="color:var(--fg-dim);padding:8px">点击 Refresh 加载</div></div>
      <div style="padding:8px"><button style="width:100%" onclick="wsSend({type:'list_sessions'})">↻ Refresh</button></div>
    </div>
    <div class="sidebar-footer"><span id="wsLabel">disconnected</span></div>
  </aside>

  <div class="main">
    <div class="chat-header">
      <span class="ws-status off" id="wsDot"></span>
      <span>WebSocket</span>
      <button class="btn" onclick="wsSend({type:'abort'})" style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--fg);padding:4px 12px;border-radius:4px;cursor:pointer;font:12px var(--font)">Abort</button>
    </div>
    <div class="messages" id="messages">
      <div class="msg system">PI RP Engine Web — 启动 engine 后自动连接</div>
    </div>
    <div class="input-area">
      <input type="text" id="input" placeholder="输入消息…" autofocus onkeydown="if(event.key==='Enter')send()" />
      <button onclick="send()">Send</button>
    </div>
    <div class="status-bar">
      <span id="sbMsg">ready</span>
    </div>
  </div>
</div>

<script>
  const TOKEN = window.RP_TOKEN || ""
  let ws = null
  let reconnectTimer = null

  function addMsg(type, text) {
    const el = document.createElement("div")
    el.className = `msg ${type}`
    el.textContent = text
    document.getElementById("messages").appendChild(el)
    el.scrollIntoView({ behavior: "smooth" })
  }

  function wsSend(data) {
    if (!ws || ws.readyState !== 1) {
      addMsg("error", "WebSocket 未连接")
      return
    }
    ws.send(JSON.stringify(data))
  }

  function setWSStatus(on) {
    document.getElementById("wsDot").className = `ws-status ${on ? "on" : "off"}`
    document.getElementById("wsLabel").textContent = on ? "connected" : "disconnected"
    document.getElementById("sbMsg").textContent = on ? "ready" : "connecting…"
  }

  function connect() {
    if (ws) { try { ws.close() } catch {} }
    const proto = location.protocol === "https:" ? "wss:" : "ws:"
    const url = `${proto}//${location.host}/ws?token=${TOKEN}`
    ws = new WebSocket(url)
    ws.onopen = () => {
      setWSStatus(true)
      wsSend({ type: "list_cards" })
      wsSend({ type: "list_sessions" })
    }
    ws.onclose = () => {
      setWSStatus(false)
      reconnectTimer = setTimeout(connect, 3000)
    }
    ws.onerror = () => { setWSStatus(false) }
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data)
        handleMessage(data)
      } catch {}
    }
  }

  function handleMessage(data) {
    switch (data.type) {
      case "response":
        if (!data.success) addMsg("error", `Command failed: ${data.error || data.command}`)
        break
      case "event": {
        const ev = data.event
        if (ev.type === "message_start" && ev.message?.role === "user") {
          const c = typeof ev.message.content === "string" ? ev.message.content : ""
          addMsg("user", c)
        }
        if (ev.type === "message_update" && ev.message?.role === "assistant") {
          const c = typeof ev.message.content === "string" ? ev.message.content : ""
          addMsg("assistant", c)
        }
        if (ev.type === "message_end") addMsg("event", "[turn ended]")
        break
      }
      case "card_list":
        renderCards(data.cards || [], data.activeIds || [])
        break
      case "cards_activated":
        addMsg("system", `Cards activated: ${data.names?.join(", ")} (restart required)`)
        wsSend({ type: "list_cards" })
        break
      case "sessions_list":
        renderSessions(data.sessions || [])
        break
      default:
        // ignore unknown message types
    }
  }

  function renderCards(cards, activeIds) {
    const el = document.getElementById("cardList")
    if (!cards.length) { el.innerHTML = "<div style='color:var(--fg-dim);padding:8px'>无卡片</div>"; return }
    el.innerHTML = cards.map(c => `
      <div class="card-item">
        <span class="active-dot ${activeIds.includes(c.id) ? 'on' : 'off'}"></span>
        <span class="name">${esc(c.name || c.id)}</span>
        <button style="background:none;border:1px solid var(--border);color:var(--fg);padding:2px 8px;border-radius:3px;cursor:pointer;font:11px var(--font)"
          ${activeIds.includes(c.id) ? 'disabled' : ''}
          onclick="wsSend({type:'activate_cards',cardIds:['${c.id}']})">
          ${activeIds.includes(c.id) ? 'active' : 'activate'}
        </button>
      </div>
    `).join("")
  }

  function renderSessions(sessions) {
    const el = document.getElementById("sessionList")
    if (!sessions.length) { el.innerHTML = "<div style='color:var(--fg-dim);padding:8px'>无 session</div>"; return }
    el.innerHTML = sessions.map(s => `
      <div class="session-item">
        <span class="name" title="${esc(s.file)}">${esc(s.preview || s.file)}</span>
        <span style="color:var(--fg-dim);font-size:10px">${(s.size/1024).toFixed(1)}KB</span>
      </div>
    `).join("")
  }

  function esc(s) {
    const d = document.createElement("div")
    d.textContent = s || ""
    return d.innerHTML
  }

  function send() {
    const input = document.getElementById("input")
    const text = input.value.trim()
    if (!text) return
    input.value = ""
    addMsg("user", text)
    wsSend({ type: "prompt", message: text })
  }

  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"))
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"))
    document.querySelector(`.tab:nth-${name === "cards" ? "child(1)" : "child(2)"}`).classList.add("active")
    document.getElementById(`tab-${name}`).classList.add("active")
    if (name === "cards") wsSend({ type: "list_cards" })
    else wsSend({ type: "list_sessions" })
  }

  connect()
</script>
</body>
</html>
